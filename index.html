:1/0,duration:2,ease:"easeInOut"},className:"flex items-center space-x-2 font-mono text-[9px] tracking-[0.4em] text-gold-brand/70 hover:text-gold-brand focus:outline-none uppercase scroll-smooth cursor-pointer",children:[u.jsx("span",{children:"Scroll to Discover"}),u.jsx(gT,{className:"w-3 h-3 text-gold-brand"})]})]})]})]})}const Il={bio:"Graduating from India’s prestigious Unitedworld Institute of Design (UID), SECRET is an artist-designer who navigates the fluid threshold where structural modernism meets cultural heritage. Her eponymous luxury couture label celebrates the soul of Indian handcrafting—marrying the ancient techniques of gold zardozi, hand-spun Banarasi silk, and delicate Chikankari with the razor-sharp tailoring, asymmetrical drapes, and effortless drapes of international Milanese couture.",philosophy:"To me, a couture garment is a living canvas. It is not designed to fit secondary trends; it is designed to hold space, evoke emotion, and last for generations. Each silhouette we craft honors the master artisans of Lucknow and Banaras, translating their ancient handskills into contemporary, high-fashion silhouettes that feel equally at home under the spotlights of Milan Fashion Week or in an intimate heritage bridal pavilion.",signatureImage:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=1200&auto=format&fit=crop",detailImage:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200&auto=format&fit=crop"},jN=[{id:"couture",title:"Chrysalis Haute Couture",subtitle:"The Graduation Suite",description:"Avant-garde structures meet raw tussar silk and handcrafted gold thread manipulation.",longDescription:"Inspired by the physical metamorphosis of nature, Chrysalis presents structural, cocoon-like silhouettes constructed from hand-woven tussar silks and structured organzas. The garments showcase hand-beaded metal-wire embroidery paired with structured collars that challenge traditional bridal boundaries.",image:"https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1200&auto=format&fit=crop",fabric:"Undyed Tussar Silk, Silk Organza, Metal Mesh",craftsmanship:"Gara Embroidery & Structured Corset Boning",mood:"Sculptural, Architectural, Warm Champagne",pieces:["The Cocoon Dress","The Metamorphosis Saree-Gown","Plated Wings Cape"]},{id:"bridal",title:"The Ivory Sanctuary",subtitle:"Bespoke Bridal Line",description:"Monochromatic champagne and ivory lehengas with hand-carved silver zardozi.",longDescription:"A rejection of loud, over-embellished bridal weight in favor of intricate, tone-on-tone quiet luxury. The collection spans structural kalidars and micro-beaded corset double-pallu sarees that take over 450 hours of handcrafting by senior artisans.",image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?q=80&w=1200&auto=format&fit=crop",fabric:"Mulberry Silk Velvet, Fine Italian Tulle, Tissue Silk",craftsmanship:"Hand-laid Dabka, Naqshi & Pearl Seed Zardozi",mood:"Angelic, Heritage, Quiet Luxury, Editorial",pieces:["The Sanctuary Lehenga","The Mughal Corset","Perian Lace Veil"]},{id:"modern-ethnic",title:"Varanasi Rhapsody",subtitle:"Contemporary Festive",description:"Heritage Banarasi brocades re-conceptualized into asymmetrical drapes and power jackets.",longDescription:"Bridging the gap between active Western tailoring and historic Indian weaves. Varanasi Rhapsody breathes new life into pure gold zari brocade, fashioning structural double-breasted jackets, tailored cigarette pants, and detachable side-swept pleated drapes.",image:"https://images.unsplash.com/photo-1566207274740-0f8cf6b7d5a5?q=80&w=1200&auto=format&fit=crop",fabric:"Pure Katan Silk with 24k Gold Zari Handloom Weaving",craftsmanship:"Kadhwa Weaving & Structured Milanese Lapel Tailoring",mood:"Bold, Regal, High-Contrast, Cosmopolitan",pieces:["The Zari Tuxedo","Asymmetrical Brocade Gown","The Banaras Trench"]},{id:"resort",title:"The Goan Monsoon",subtitle:"Resort & Cruise Wear",description:"Unstructured sand-toned linens and diaphanous Crêpe de Chine for effortless grace.",longDescription:"A lighter, sensual aesthetic inspired by the tropical humidity of the Indian coastline mixed with Amalfi Coast luxury. Think fluid kaftans with raw silk fringes, sun-bleached linen-gauze drapes, and modular dresses that transition from morning deck to evening soirée.",image:"https://images.unsplash.com/photo-1445205170230-053b830c6038?q=80&w=1200&auto=format&fit=crop",fabric:"Unbleached Fine Linen, Pure Crêpe de Chine, Silk Gauze",craftsmanship:"Hand-fringing, Shibori Silk Dyeing, Raw Organic Edge Styling",mood:"Fluid, Sun-Bleached, Serene, Sensual",pieces:["Fluid Linen Kimono","The Seafront Gauze Drape","Fringed Silk Slip"]},{id:"evening",title:"Nocturnal Symphony",subtitle:"Red Carpet & Gala",description:"Drama meets restraint in deep obsidian and rich burgundy silk velvet gowns.",longDescription:"Deeply theatrical silhouettes designed for nocturnal visual impact. Drawing inspiration from Milanese baroque arches, this collection incorporates sheer mesh illusion-backs, dramatic hand-draped godet train skirts, and hand-embroidered metallic thread panels.",image:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=1200&auto=format&fit=crop",fabric:"Obsidian Silk Velvet, Heavy Georgette, Metallic Illusion Tulle",craftsmanship:"Couture Draping, Hand-crimping, Fine Wire Hemming",mood:"Seductive, Majestic, Crimson-noir, Aristocratic",pieces:["The Obsidian Arch Gown","Crimson Baroque Cape Set","Illusion Mesh Corset"]},{id:"formal",title:"The Milan Guild",subtitle:"Contemporary Luxury Formal",description:"Tailored luxury essentials presenting high-fashion geometry and soft leather detailing.",longDescription:"An answer to the modern woman’s craving for commanding luxury. Composing sharp-shouldered blazers with integrated corsets, hand-stitched leather piping, and heavy crepe tailoring in soft sand, ivory, and matte black tones.",image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1200&auto=format&fit=crop",fabric:"Double-faced Heavy Wool Crepe, Fine Nappa Leather Highlights",craftsmanship:"Saddle-stitch Tailoring, Hand-rolled Silk Satin Collars",mood:"Structured, Sophisticated, Boss-maternal, Neutral",pieces:["Saddle-stitched Tuxedo Jacket","Corseted Wool Trouser","Marble Leather Trench"]}],Yg=[{id:"p1",title:"Chrysalis Runway Debut",category:"Runway",image:"https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1200&auto=format&fit=crop",description:"The pivotal look of the Chrysalis graduation capsule showcased under geometric laser grids.",year:"2025",location:"Karnavati University Fashion Dome",materials:["Tussar Silk","Hand-molded Brass Wire"]},{id:"p2",title:"The Ivory Sanctuary Campaign",category:"Campaign",image:"https://images.unsplash.com/photo-1518049362265-d56c72337b20?q=80&w=1200&auto=format&fit=crop",description:"Captured inside a stark neoclassical marble pavilion in Rajasthan, highlighting tone-on-tone thread work.",year:"2026",location:"Samode Palace, Jaipur",materials:["Mughal Silk Gazar","Precious Seed Pearls"]},{id:"p3",title:"Draping Masters Workshop",category:"Behind the Scenes",image:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200&auto=format&fit=crop",description:"SECRET hand-sculpting the signature asymmetric silk collar directly on a French tailor's dummy.",year:"2025",location:"Studio SECRET, Ahmedabad",materials:["Muslin Prototype","Draping Pins"]},{id:"p4",title:"The Banaras Moodboard",category:"Moodboard",image:"https://images.unsplash.com/photo-1544816155-12df9643f363?q=80&w=1200&auto=format&fit=crop",description:"A convergence of gold threads, dried bougainvillea, and architectural sketches from Milanese cathedrals.",year:"2026",location:"Studio Mood Archives",materials:["Raw Threads","Linen Swatches","Ink Sketches"]},{id:"p5",title:"The Mughal Arch Gown Construction",category:"Design Process",image:"https://images.unsplash.com/photo-1485462537746-965f33f7f6a7?q=80&w=1200&auto=format&fit=crop",description:"Drafting the complex structural corset bodice that anchors the sheer silk back.",year:"2025",location:"Pattern Drafting Suite",materials:["Pattern Paper","Satin Linings"]},{id:"p6",title:"Varanasi Rhapsody Editorial",category:"Campaign",image:"https://images.unsplash.com/photo-1469334031218-e382a71b716b?q=80&w=1200&auto=format&fit=crop",description:"Golden hour campaign showcasing the zari handloom trench jacket in contrast with brutalist architecture.",year:"2026",location:"Brutalist Pavilion, Chandigarh",materials:["Kadhwa Gold Brocade","Raw Denim-Silk Interweave"]}],jn=[{title:"The Banaras Loom Complex",origin:"Varanasi, India",description:"Every weave tells a genealogical story. In the historical alleys of Madanpura, master weavers interweave silk and gold alloy wires (zari) in a rhythmic cadence that mimics a loom’s heartbeat.",image:"https://images.unsplash.com/photo-1566207274740-0f8cf6b7d5a5?q=80&w=1200&auto=format&fit=crop",overlayText:"Woven Genealogies",textileDetail:"24-Karat Gold Plated Weft, Katan Silk Warp, hand-drawn floral jaal patterns."},{title:"The Milanese Arch",origin:"Milan, Italy",description:"The imposing geometry of Duomo di Milano and the Galeria Vittorio Emanuele. The sharp lines, architectural ribbing, and soft marble reflections inspire the structured lapels and dramatic silhouettes.",image:"https://images.unsplash.com/photo-1518049362265-d56c72337b20?q=80&w=1200&auto=format&fit=crop",overlayText:"Arch-Inspired Structure",textileDetail:"Structured wool crepe backing, clean architectural seams, and concealed canvas structural boning."},{title:"Sartorial Restraint",origin:"London & Savile Row",description:"From the heritage tailoring lines of British gentlemen's couture. Translating clean double-breasted buttoning, inner-facing canvassing, and canvas waistcoats into powerful feminine luxury statements.",image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1200&auto=format&fit=crop",overlayText:"Savile Precision",textileDetail:"Double-faced worsted wool blend, handcrafted shoulder pads, silk-lined pockets."}],Jn=[{id:"j1",title:"The Taxonomy of Gold: Decoding Authentic Zardozi",category:"Couture Process",summary:"SECRET writes on the dying art of hand-crafted gold Naqshi embroidery and its modern preservation.",content:["In a world accelerated by mass-machined polyester metallics, authentic metal embroidery holds an irreplaceable weight—both physically and historically.","The term Zardozi derives from two Persian words: 'Zar' meaning gold, and 'Dozi' meaning sewing. Our studio operates a dedicated atelier partnering with sixteen multi-generational karigars in Lucknow to employ authentic silver and gold alloy wires.","In this journal entry, we analyze the micro-movements of hand-starching silk panels on wooden 'Addas' (embroidery frames) and the detailed mathematics of shading using three sizes of micro-helices (Dabka, Kasab, and Gizan). A single lehenga corner of our luxury sanctuary capsule requires 12,000 individually hand-snipped spirals, a true testament to the quiet luxury of human touch."],image:"https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=1200&auto=format&fit=crop",date:"April 18, 2026",readTime:"7 min read",author:"SECRET"},{id:"j2",title:"The Metamorphosis Concept: Designing the Chrysalis Capsule",category:"Design Journal",summary:"Exploring the emotional journey and academic challenges faced while drafting the graduation collection.",content:["My graduation collection at UID, 'Chrysalis', was born from a desire to merge structural entomology with fluid Indian drapes.","I asked myself: Can a garment feel like a defensive shield, yet flow behind the model like a whisper?","To resolve this, we spent eight weeks engineering a custom inner corset structure using surgical-grade flexible metal boning, wrapped in heavily starched raw mulberry cocoons. We then draped un-dyed tussar silk over this scaffold. When the model walks, the stiff cocoon bodice forces a slow, majestic, architectural pace, creating a profound cinematic friction on the runway."],image:"https://images.unsplash.com/photo-1485462537746-965f33f7f6a7?q=80&w=1200&auto=format&fit=crop",date:"January 11, 2026",readTime:"5 min read",author:"SECRET"},{id:"j3",title:"Milanese Drapery & Sandstorms of Rajasthan",category:"Global Travelogue",summary:"Bridging the architectural geometries of Europe with the expansive colors of western India.",content:["To design contemporary global silhouettes, one must learn to see in dual horizons.","While in Milan, I observed how light fell on the gray marble pillars of the Palazzo Litta, forming sharp, high-contrast, linear shadows. Weeks later, while deep in Rajasthan researching bridal heritage, I saw the desert sandstorms wrap around sandstone arches, softening every hard edge with ivory dust.","This duality—the sharp, intentional line of Europe, softened by the organic, poetic drapes of India—became the blueprint for our asymmetric blazer and double-pallu drapes. We don't merge cultures; we let them collide gracefully to form something altogether new."],image:"https://images.unsplash.com/photo-1518049362265-d56c72337b20?q=80&w=1200&auto=format&fit=crop",date:"May 02, 2026",readTime:"9 min read",author:"SECRET"}],Sa=[{phase:"I. Concept & Fabric Archivism",title:"Sourcing Traditional Karigari",description:"Every collection begins with a long journey to the weaving pockets of Uttar Pradesh and West Bengal. SECRET personally co-drafts pattern counts with master weavers, selecting pristine silk lots and specifying yarn blends.",image:"https://images.unsplash.com/photo-1544816155-12df9643f363?q=80&w=1200&auto=format&fit=crop",sketchNote:"D-109 Loom Blueprint: Katan warp blended with metallic silver threads to generate a liquid mercury drape.",technicalDetails:["Raw fiber density analysis (Denier count verification)","Zari authenticity certificate filing","Natural pigment-dye bath profiling"]},{phase:"II. Pattern Blueprinting",title:"Anatomical Drape Engineering",description:"Unlike mass garments, SECRET's designs are sculpted in 3D on custom mannequins. Every pattern piece is calculated mathematically to direct the weight of the handloom silks toward the shoulder joints and waist anchors, preventing fatigue.",image:"https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200&auto=format&fit=crop",sketchNote:"Drape blueprint: Asymmetrical kalidar utilizing biased center panels for continuous vertical movement.",technicalDetails:["3D volumetric drape mapping","Stress-point linen reinforcements","Hand-slat fabric balance calculators"]},{phase:"III. Embroidery Ateliers",title:"Lucknow & Varanasi Wood-Framing",description:"The panels are hand-drawn with water-soluble indigo ink, stretched onto massive modular teakwood frames (Addas), then hand-embroidered over several weeks by resident karigars using historical single-needle work.",image:"https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=1200&auto=format&fit=crop",sketchNote:"Naqshi Blueprint: Mughal floral relief utilizing fine seed pearl centers with miniature bullion coiled borders.",technicalDetails:["Custom carbon-stencil placement tracking","Multi-directional thread anchoring","Saddle-stitch back tensioning"]}],TN=[{id:"ig1",image:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=1000&auto=format&fit=crop",caption:"#SECRETCouture: Handcrafted architectural bodice in pure ivory mulberry silk. Designed for the modern visionary.",likes:"4.2k",comments:"128"},{id:"ig2",image:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=1000&auto=format&fit=crop",caption:"#NocturnalSymphony: Elegance drapes in heavy obsidian silk velvet. A red carpet masterpiece tailored in Milan.",likes:"3.8k",comments:"94"},{id:"ig3",image:"https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1000
